[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "oj-toolkit"
version = "0.5.0"
description = "Centralized shared utilities for ownjoo projects: standardized logging config, type validation, data parsing, console output, and async utilities"
authors = [
    { name = "Speedy", email = "speedy@ownjoo.org" }
]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "jmespath>=1.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["utilities", "validation", "parsing", "logging", "console", "color", "formatting", "async", "generators", "timeout"]
readme = "README.md"

[project.urls]
Homepage = "https://github.com/ownjoo/utils"
Repository = "https://github.com/ownjoo/utils"
"Bug Tracker" = "https://github.com/ownjoo/utils/issues"
Changelog = "https://github.com/ownjoo/utils/releases"
Documentation = "https://github.com/ownjoo/utils#readme"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
    "pylint>=2.0",
]

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | __pycache__
)/
'''

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".git",
    ".hg",
    ".mypy_cache",
    ".tox",
    ".venv",
    "_build",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "C4",   # flake8-comprehensions
    "B",    # flake8-bugbear
]
ignore = [
    "E501",  # line too long (handled by black)
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["test"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--strict-markers --tb=short"
asyncio_mode = "auto"
markers = [
    "integration: integration tests",
    "unit: unit tests",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Not required for this project
ignore_missing_imports = true
